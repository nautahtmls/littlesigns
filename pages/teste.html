
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.accordion {
    border: 1px solid #ccc;
    margin-bottom: 10px;
}

.titulo {
    padding: 15px;
    cursor: pointer;
    background: #eee;
}

.conteudo {
    display: none;
    padding: 15px;
}

.accordion.aberto .conteudo {
    display: block;
}
</style>
</head>

<body>

<div class="accordion">
    <div class="titulo">Título 1</div>
    <div class="conteudo">
        Conteúdo da primeira div.
    </div>
</div>

<div class="accordion">
    <div class="titulo">Título 2</div>
    <div class="conteudo">
        Conteúdo da segunda div.
    </div>
</div>

<div class="accordion">
    <div class="titulo">Título 3</div>
    <div class="conteudo">
        Conteúdo da terceira div.
    </div>
</div>

<script>
document.querySelectorAll('.titulo').forEach(function(titulo) {

    titulo.addEventListener('click', function() {

        const bloco = this.closest('.accordion');

        bloco.classList.toggle('aberto');

    });

});
</script>

</body>
</html>
